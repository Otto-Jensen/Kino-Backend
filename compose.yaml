services:
  db:
    image: mysql:8.4
    container_name: kino-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kino
    volumes:
      - db_data:/var/lib/mysql

    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino-backend-app
    restart: unless-stopped
    environment:
      URL: jdbc:mysql://db:3306/kino?createDatabaseIfNotExist=true
      USERNAME: root
      PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/kino?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
